name: CI

on:
  push:
    branches: [main, feat/upgrade, release/store-ready]
  pull_request:
    branches: [main, feat/upgrade]

# Least-privilege by default; jobs opt into more where needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. API — NestJS (pnpm): format, lint, typecheck, jest (+ supertest +
  #    mongodb-memory-server) and build. Coverage -> Codecov flag "api".
  # ---------------------------------------------------------------------------
  api:
    name: API (NestJS / pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10

      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier (check)
        run: pnpm run format:check

      - name: ESLint (check)
        run: pnpm run lint:check

      - name: Type-check
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Unit tests + coverage
        run: pnpm run test:cov:ci

      - name: E2E tests (supertest + mongodb-memory-server)
        run: pnpm run test:e2e

      - name: Build
        run: pnpm run build

      - name: Verify OpenAPI spec is in sync
        run: |
          pnpm run generate:openapi
          if ! git diff --quiet -- ../../shared/api-spec/openapi.yaml; then
            echo "::error::shared/api-spec/openapi.yaml is out of date. Run 'pnpm --filter @readrealm/api generate:openapi' and commit."
            git --no-pager diff -- ../../shared/api-spec/openapi.yaml
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@015f24e6818733317a2da2edd6290ab26238649a # v5.0.7
        with:
          flags: api
          directory: apps/api/coverage
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # 2. Android — Kotlin / Compose: detekt + unit tests via Gradle.
  # ---------------------------------------------------------------------------
  android:
    name: Android (Kotlin / Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK (Temurin 17)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: detekt (static analysis)
        run: ./gradlew detekt
        continue-on-error: true # non-blocking until baseline is curated

      - name: Unit tests and Play release bundle
        run: ./gradlew testDebugUnitTest assembleDebug bundleRelease --no-daemon

  # ---------------------------------------------------------------------------
  # 3. Dashboard — Flutter: very_good_analysis + flutter test.
  # ---------------------------------------------------------------------------
  dashboard:
    name: Dashboard (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Existing dashboard style debt is tracked separately; analyzer errors
        # still fail the build, while warnings/infos remain visible in logs.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Tests
        run: flutter test

  # ---------------------------------------------------------------------------
  # 4. iOS — SwiftLint + Xcode 26+ simulator build. Blocking because the
  #    App Store requires uploads built with the current iOS 26 SDK toolchain.
  # ---------------------------------------------------------------------------
  ios:
    name: iOS (Xcode 26 / SwiftLint)
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/ios/ReadRealm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify App Store Xcode toolchain
        run: |
          xcodebuild -version
          major="$(xcodebuild -version | awk 'NR==1 {split($2, a, "."); print a[1]}')"
          test "$major" -ge 26

      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint --config ../../../.swiftlint.yml || true

      - name: Build (simulator)
        run: |
          xcodebuild \
            -project Application.xcodeproj \
            -scheme ReadRealm \
            -destination 'generic/platform=iOS Simulator' \
            build CODE_SIGNING_ALLOWED=NO

  # ---------------------------------------------------------------------------
  # Security: CodeQL (ts + kotlin + swift), Trivy (FS, SHA-pinned), gitleaks.
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL
    runs-on: ${{ matrix.language == 'swift' && 'macos-26' || 'ubuntu-latest' }}
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, java-kotlin, swift]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: ${{ matrix.language }}

      - name: Build Android for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Autobuild
        if: matrix.language != 'java-kotlin'
        uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4

      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4

  trivy:
    name: Trivy (filesystem + config)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # NOTE: trivy-action pinned to a commit SHA (it had a 2026 tag-hijack).
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
        env:
          TRIVY_SKIP_DIRS: node_modules

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
