name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    # 1. Install pnpm before setup-node
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    # 2. Get pnpm store directory (Fixes the  "packages field missing" error)
    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    # 3. Setup Node with manual cache path
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        # We point directly to the path we found in step 2
        cache: 'pnpm'
        cache-dependency-path: '**/pnpm-lock.yaml'

    # 3. Install dependencies (Equivalent to npm ci)
    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    # 4. Standard NestJS Quality Checks
    - name: Check code formatting
      run: pnpm run format

    - name: Lint code
      run: pnpm run lint

    # 5. Build
    - name: Build project
      run: pnpm run build