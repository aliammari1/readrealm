<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-label="ReadRealm — Where books meet intelligence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C2434"/>
      <stop offset="1" stop-color="#0F1626"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A24B"/>
      <stop offset="1" stop-color="#E4C878"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>

  <!-- node mesh: pages dissolving into a network -->
  <g stroke="#C9A24B" stroke-opacity="0.35" stroke-width="1.5">
    <line x1="1180" y1="170" x2="1300" y2="120"/>
    <line x1="1300" y1="120" x2="1420" y2="200"/>
    <line x1="1420" y1="200" x2="1340" y2="320"/>
    <line x1="1340" y1="320" x2="1200" y2="300"/>
    <line x1="1200" y1="300" x2="1180" y2="170"/>
    <line x1="1300" y1="120" x2="1200" y2="300"/>
    <line x1="1180" y1="170" x2="1420" y2="200"/>
  </g>
  <g fill="url(#gold)">
    <circle cx="1180" cy="170" r="6"/>
    <circle cx="1300" cy="120" r="7"/>
    <circle cx="1420" cy="200" r="6"/>
    <circle cx="1340" cy="320" r="6"/>
    <circle cx="1200" cy="300" r="6"/>
  </g>

  <!-- open book -->
  <g transform="translate(1120 230)" fill="none" stroke="#F4ECD8" stroke-width="3" stroke-linejoin="round">
    <path d="M0 0 C 40 -20 90 -20 120 0 L 120 110 C 90 90 40 90 0 110 Z" fill="#F4ECD8" fill-opacity="0.08"/>
    <path d="M120 0 C 150 -20 200 -20 240 0 L 240 110 C 200 90 150 90 120 110 Z" fill="#F4ECD8" fill-opacity="0.08"/>
    <line x1="120" y1="0" x2="120" y2="110"/>
  </g>

  <!-- wordmark -->
  <text x="120" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#F4ECD8">ReadRealm</text>
  <text x="124" y="290" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#C9A24B" letter-spacing="2">Where books meet intelligence</text>
  <text x="124" y="340" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#5B6473">One NestJS backend · Android · iOS · Flutter · real-time AI book-chat</text>

  <rect x="120" y="372" width="240" height="4" rx="2" fill="url(#gold)"/>
</svg>
