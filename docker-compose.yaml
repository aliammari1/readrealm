services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: readrealm-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URL: mongodb://mongodb:27017/readrealm
      JWT_SECRET: ${JWT_SECRET:-change_me_before_production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      MAX_JSON_BODY_SIZE: ${MAX_JSON_BODY_SIZE:-10mb}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_multilingual_v2}
      ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_MODEL: ${GEMINI_API_MODEL:-gemini-2.0-flash}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - readrealm-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health',r=>{if(r.statusCode!==200)process.exit(1);r.resume()}).on('error',()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: readrealm-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: readrealm
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - readrealm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
  mongodb_config:

networks:
  readrealm-network:
    driver: bridge
