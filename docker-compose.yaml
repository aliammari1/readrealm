version: '3.8'

services:
  # ============================================================
  # BACKEND - NestJS API
  # ============================================================
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: readrealm-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      MONGODB_URL: mongodb://mongodb:27017/readrealm
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_here}
      GOOGLE_AI_KEY: ${GOOGLE_AI_KEY}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY}
      AZURE_TTS_KEY: ${AZURE_TTS_KEY}
      AZURE_REALTIME_KEY: ${AZURE_REALTIME_KEY}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
    depends_on:
      - mongodb
    networks:
      - readrealm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # DATABASE - MongoDB
  # ============================================================
  mongodb:
    image: mongo:7.0
    container_name: readrealm-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: readrealm
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - readrealm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  readrealm-network:
    driver: bridge
